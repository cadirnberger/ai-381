version: "3.1"

actions:
  - action_check_room_availability

slots:
  recipient:
    type: text
    mappings:
      - type: from_llm
  amount:
    type: float
    mappings:
      - type: from_llm
  issue_category:
    type: categorical
    values: ["hardware", "software", "account_access", "other"]
    mappings:
      - type: from_llm
  issue_description:
    type: text
    mappings:
      - type: from_llm
  urgency:
    type: categorical
    values: ["low", "medium", "high"]
    mappings:
      - type: from_llm
  room_type:
    type: categorical
    values:
      - "quiet"
      - "group"
      - "media"
    mappings:
      - type: from_llm
  room_status:
    type: text
    mappings:
      - type: controlled

responses:
  utter_library_hours:
  - text: "The library is open Monday through Friday, 8am to midnight, and weekends 10am to 8pm."
  utter_ask_room_type:
    - text: "Would you like a quiet room, a group room, or a media room?"
  utter_please_wait_room_check:
    - text: "One moment, let me check that for you."
  utter_room_availability_result:
    - text: "Here's what I found: the {room_type} room is {room_status}."
  utter_ask_recipient:
    - text: "Who would you like to send money to?"

  utter_ask_amount:
    - text: "How much money would you like to send?"

  utter_transfer_complete:
    - text: "All done. {amount} has been sent to {recipient}."

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          You are a helpful assistant for a college course and IT help desk.
          You can answer questions about instructor office hours, the course syllabus,
          assignment deadlines, and IT support requests.
          Do not claim to be a money transfer assistant.
          If the user reports a technical problem, help them start an IT support ticket.
          If the user asks a course question, answer only when the relevant information is available.
          Keep responses clear, friendly, and concise.
          Context / previous conversation with the user:
          {{history}}
          {{current_input}}
          Suggested AI Response:
  utter_office_hours:
    - text: "Office hours are Tue/Thu 2–3pm in Ford 210, or by appointment."
  utter_syllabus_location:
    - text: "The syllabus is posted on the course Canvas page, under Files."
  utter_assignment_deadline:
    - text: "Check the Canvas calendar for exact due dates — they vary by assignment."
  utter_ask_issue_category:
    - text: "What kind of issue is this — hardware, software, or account access?"
  utter_ask_issue_description:
    - text: "Briefly describe the problem."
  utter_ask_urgency:
    - text: "How urgent is this — low, medium, or high?"
  utter_escalate:
    - text: "This looks urgent — flagging it for immediate review."
  utter_ticket_summary:
    - text: "Ticket created: {issue_category} issue — '{issue_description}', urgency: {urgency}."