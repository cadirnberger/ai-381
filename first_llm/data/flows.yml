flows:
  tell_library_hours:
    description: User wants to know the library's opening hours.
    steps:
      - action: utter_library_hours

  check_room_availability:
    description: User wants to check whether a study room is available to book.
    steps:
      - collect: room_type
      - action: utter_please_wait_room_check
      - action: action_check_room_availability
      - action: utter_room_availability_result
  transfer_money:
    description: Help users send money to friends and family.
    steps:
      - collect: recipient
      - collect: amount
        description: the number of US dollars to send
      - action: utter_transfer_complete
  tell_office_hours:
    description: User wants to know instructor office hours.
    steps:
      - action: utter_office_hours

  tell_syllabus_location:
    description: User wants to know where to find the course syllabus.
    steps:
      - action: utter_syllabus_location

  tell_assignment_deadline:
    description: User wants to know when an assignment is due.
    steps:
      - action: utter_assignment_deadline
  submit_it_ticket:
    description: User wants to report a tech problem or request IT help.
    steps:
      - collect: issue_category
      - collect: issue_description
      - collect: urgency
        next:
          - if: slots.urgency == "high"
            then:
              - action: utter_escalate
              - link: pattern_human_handoff
          - else:
              - action: utter_ticket_summary
                next: END
